name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  research-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Validate research catalog, policy and evidence hashes
        run: python tools/validate_research.py

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate MaaFramework schemas
        run: >-
          python tools/validate_schema.py
          --schema-dir deps/tools
          --resource-dirs assets/resource
          --interface-files assets/interface.json

  maa-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install checker
        run: npm ci

      - name: Run Maa checker
        run: npm run maa:check
